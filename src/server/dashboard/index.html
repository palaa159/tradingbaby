<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Academy</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b23; --line: #262d38; --ink: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, "Noto Sans Thai", system-ui, sans-serif;
    display: grid; grid-template-columns: 290px 1fr; height: 100vh; overflow: hidden;
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .motto { color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 18px; }
  .card {
    background: #1b222c; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s;
  }
  .card:hover { border-color: #3d4756; }
  .card.on { border-color: var(--accent); background: #1c2735; }
  .card h2 { font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .traits { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .bar { height: 5px; background: #0d1117; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .stats { color: var(--dim); font-size: 11px; display: flex; gap: 10px; }
  .alpha { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--dim); }
  .alpha.win { color: var(--ok); } .alpha.lose { color: var(--bad); }
  .alpha em { display: block; font-style: normal; font-weight: 400; font-size: 10px; color: var(--dim); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11px; }
  td { padding: 7px 10px; border-bottom: 1px solid #1d232c; vertical-align: top; }
  tr.sell td:nth-child(2) { color: var(--bad); } tr.buy td:nth-child(2) { color: var(--ok); }
  .trades { overflow-y: auto; padding: 18px; }
  .trades h3 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 500; }
  .trades section { margin-bottom: 24px; }
  .note { color: var(--warn); font-size: 11px; }
  .why { color: var(--dim); font-size: 11px; }
  .pill { font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #0d1117; color: var(--dim); }
  .pill.well_fed { color: var(--ok); } .pill.hungry { color: var(--warn); }
  .pill.starving, .pill.suspended { color: var(--bad); }
  main { display: flex; flex-direction: column; overflow: hidden; }
  nav { display: flex; gap: 4px; padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
  nav button {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
    padding: 8px 14px; cursor: pointer; font: inherit;
  }
  nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .view { flex: 1; overflow: hidden; display: none; position: relative; }
  .view.on { display: flex; flex-direction: column; }
  canvas { flex: 1; display: block; width: 100%; }
  .timeline { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .timeline input { flex: 1; accent-color: var(--accent); }
  .timeline button { background: #21262d; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  .when { color: var(--dim); font-size: 11px; min-width: 190px; }
  .live { color: var(--ok); }
  .legend { position: absolute; top: 12px; left: 16px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--dim); pointer-events: none; }
  .legend span::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: currentColor; }
  .detail {
    position: absolute; right: 16px; top: 12px; width: 330px; max-height: 78%; overflow-y: auto;
    background: rgba(22,27,35,.97); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: none;
  }
  .detail.on { display: block; }
  .detail h3 { margin: 0 0 4px; font-size: 14px; }
  .detail .meta { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
  .detail p { margin: 0; white-space: pre-wrap; font-size: 13px; }
  .diary { overflow-y: auto; padding: 20px; }
  .entry { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid #a371f7; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; max-width: 760px; }
  .entry h4 { margin: 0 0 2px; font-size: 13px; }
  .entry time { color: var(--dim); font-size: 11px; }
  .entry p { white-space: pre-wrap; margin: 8px 0 0; }
  .empty { color: var(--dim); padding: 30px; }
</style>
</head>
<body>
<aside>
  <h1>🎓 Alpha Academy</h1>
  <div class="motto">Learn · Build · Measure · Repeat</div>
  <div id="classroom"></div>
</aside>

<main>
  <nav>
    <button data-view="brain" class="on">สมอง</button>
    <button data-view="trades">เทรดและสูตร</button>
    <button data-view="library">ห้องสมุดกลาง</button>
    <button data-view="diary">ไดอารี่</button>
    <button data-view="schedule">ตารางเรียน</button>
    <button data-view="principal">ครูใหญ่</button>
  </nav>

  <section class="view on" id="view-brain">
    <div class="legend" id="legend"></div>
    <canvas id="canvas"></canvas>
    <div class="detail" id="detail"></div>
    <div class="timeline">
      <button id="play">▶ เล่นย้อนหนัง</button>
      <input type="range" id="slider" min="0" max="100" value="100">
      <span class="when" id="when"></span>
    </div>
  </section>

  <section class="view trades" id="view-trades"></section>
  <section class="view trades" id="view-library"></section>
  <section class="view diary" id="view-diary"></section>
  <section class="view trades" id="view-schedule"></section>
  <section class="view trades" id="view-principal"></section>
</main>

<script>
const KIND = {
  concept:        { color: '#58a6ff', label: 'ความรู้' },
  question:       { color: '#d29922', label: 'คำถามคาใจ' },
  source:         { color: '#8b949e', label: 'แหล่งอ้างอิง' },
  lesson:         { color: '#3fb950', label: 'บทเรียน' },
  diary_entry:    { color: '#a371f7', label: 'ไดอารี่' },
  hypothesis:     { color: '#f778ba', label: 'ข้อสงสัย' },
  strategy:       { color: '#39c5cf', label: 'สูตรเทรด' },
  trade_journal:  { color: '#db6d28', label: 'บันทึกเทรด' },
  conversation:   { color: '#bc8cff', label: 'บทสนทนา' },
  feature_request:{ color: '#ff7b72', label: 'คำร้อง' },
};

let students = [], current = null, graph = { nodes: [], edges: [], bounds: { first: 0, last: 0 } };
let layout = new Map(), selected = null, playing = false, atTime = Infinity;

const $ = (id) => document.getElementById(id);
const fmt = (ms) => ms ? new Date(ms).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '—';

$('legend').innerHTML = Object.values(KIND).map(k =>
  `<span style="color:${k.color}">${k.label}</span>`).join('');

async function loadClassroom() {
  students = await (await fetch('/api/students')).json();
  $('classroom').innerHTML = students.length ? students.map(s => `
    <div class="card ${s.id === current ? 'on' : ''}" data-id="${s.id}">
      <h2>${s.name} <span class="pill ${s.hunger}">${s.hunger}</span></h2>
      <div class="traits">${s.traits}</div>
      <div class="bar"><i style="width:${Math.min(100, s.energy / s.maxEnergy * 100)}%"></i></div>
      <div class="stats"><span>⚡ ${s.energy}</span><span>🧠 ${s.nodeCount}</span><span>🔗 ${s.edgeCount}</span></div>
      ${s.alpha ? `<div class="alpha ${s.alpha.alphaPct > 0.5 ? 'win' : s.alpha.alphaPct < -0.5 ? 'lose' : ''}">
        α ${s.alpha.alphaPct > 0 ? '+' : ''}${s.alpha.alphaPct.toFixed(2)}%
        <em>เธอ ${s.alpha.studentReturnPct.toFixed(1)}% · ไม้บรรทัด ${s.alpha.benchmarkReturnPct.toFixed(1)}%</em>
      </div>` : ''}
    </div>`).join('') : '<div class="empty">ยังไม่มีนักเรียน — รัน bun run cycle ก่อน</div>';

  document.querySelectorAll('.card').forEach(el =>
    el.onclick = () => select(el.dataset.id));
  if (!current && students[0]) select(students[0].id);
}

async function select(id) {
  current = id; selected = null; layout.clear(); atTime = Infinity;
  $('slider').value = 100;
  document.querySelectorAll('.card').forEach(el => el.classList.toggle('on', el.dataset.id === id));
  await Promise.all([loadBrain(), loadDiary(), loadTrades(), loadLibrary()]);
}

async function loadBrain() {
  if (!current) return;
  const at = atTime === Infinity ? '' : `&at=${atTime}`;
  graph = await (await fetch(`/api/brain?student=${encodeURIComponent(current)}${at}`)).json();
  for (const n of graph.nodes) {
    if (!layout.has(n.id)) {
      const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 120;
      layout.set(n.id, { x: Math.cos(a) * r, y: Math.sin(a) * r, vx: 0, vy: 0 });
    }
  }
  const live = atTime === Infinity;
  $('when').innerHTML = live
    ? `<span class="live">● สด</span> · ${graph.total} events`
    : `${fmt(atTime)} · ${graph.shown}/${graph.total} events`;
}

async function loadTrades() {
  const data = await (await fetch(`/api/trades?student=${encodeURIComponent(current)}`)).json();
  const esc = (s) => String(s ?? '').replace(/</g, '&lt;');

  const fills = data.fills.length ? `<table>
    <tr><th>เวลา</th><th>ทำอะไร</th><th>เหรียญ</th><th>จำนวน</th><th>ราคา</th><th>เพราะอะไร · จากความรู้ไหน</th></tr>
    ${data.fills.map(f => `<tr class="${f.side}">
      <td>${fmt(f.at)}</td><td>${f.side === 'buy' ? 'ซื้อ' : 'ขาย'}</td><td>${esc(f.symbol)}</td>
      <td>${f.quantity.toFixed(4)}</td><td>${f.price.toFixed(2)}</td>
      <td><div class="why">${esc(f.reason)}</div>
        ${f.strategy ? `<div class="why">สูตร ${esc(f.strategy.id)} (v${f.strategy.version}, ${f.strategy.status})</div>` : ''}
        ${f.hypothesisIds.length ? `<div class="why">← ข้อสงสัย: ${f.hypothesisIds.map(esc).join(', ')}</div>` : ''}
        ${f.guardrailNote ? `<div class="note">⚠ ${esc(f.guardrailNote)}</div>` : ''}</td>
    </tr>`).join('')}</table>` : '<div class="empty">ยังไม่มีการเทรด</div>';

  const blocked = data.blocked.length ? `<table>
    <tr><th>เวลา</th><th>ทำอะไร</th><th>เหรียญ</th><th>กติกาที่ห้าม</th></tr>
    ${data.blocked.map(b => `<tr><td>${fmt(b.at)}</td><td>${b.side === 'buy' ? 'ซื้อ' : 'ขาย'}</td>
      <td>${esc(b.symbol)}</td><td class="note">${esc(b.reason)}</td></tr>`).join('')}</table>` : '';

  const strategies = data.strategies.length ? `<table>
    <tr><th>สูตร</th><th>ฝั่ง</th><th>กราฟ</th><th>เวอร์ชัน</th><th>สถานะ</th><th>ไม้</th><th>จากข้อสงสัย</th></tr>
    ${data.strategies.map(s => `<tr><td>${esc(s.spec.name)}</td>
      <td>${s.spec.direction === 'short' ? '▼ ขาลง' : '▲ ขาขึ้น'}</td>
      <td>${esc(s.spec.timeframe)}</td><td>v${s.version}</td>
      <td>${s.status === 'active' ? 'ใช้งาน' : 'ปลดแล้ว'}</td><td>${s.spec.sizePct}%</td>
      <td class="why">${s.fromHypothesisIds.map(esc).join(', ') || '—'}</td></tr>`).join('')}</table>`
    : '<div class="empty">ยังไม่มีสูตร</div>';

  $('view-trades').innerHTML =
    `<section><h3>ชั้นวางสูตร</h3>${strategies}</section>` +
    `<section><h3>การเทรด</h3>${fills}</section>` +
    (blocked ? `<section><h3>คำสั่งที่กติกาบ้านห้ามไว้</h3>${blocked}</section>` : '');
}

async function loadLibrary() {
  const data = await (await fetch('/api/library')).json();
  const esc = (s) => String(s ?? '').replace(/</g, '&lt;');
  const LABEL = {
    endorsed: ['สถาบันรับรอง', 'var(--ok)'],
    rejected: ['สถาบันตีตก', 'var(--dim)'],
    disputed: ['ยังเถียงกันอยู่', 'var(--warn)'],
    insufficient: ['หลักฐานยังไม่พอ', 'var(--dim)'],
  };
  const s = data.summary;
  const head = `<div class="stats" style="gap:18px;margin-bottom:16px;font-size:13px">
    <span style="color:var(--ok)">รับรองแล้ว ${s.endorsed}</span>
    <span style="color:var(--warn)">กำลังเถียง ${s.disputed}</span>
    <span>ตีตก ${s.rejected}</span><span>รอหลักฐาน ${s.pending}</span>
    <span style="margin-left:auto">ทั้งชั้น ${data.classSize} คน</span></div>`;

  $('view-library').innerHTML = head + (data.entries.length ? `<table>
    <tr><th>ข้ออ้าง (กฎที่พิสูจน์)</th><th>สถานะ</th><th>ใครยืนยันบ้าง</th></tr>
    ${data.entries.map(e => {
      const [label, color] = LABEL[e.consensus] ?? [e.consensus, 'var(--dim)'];
      return `<tr>
        <td><div>${esc(e.statement)}</div></td>
        <td style="color:${color};font-weight:600">${label}</td>
        <td class="why">${e.verdicts.map(v =>
          `${esc(v.studentName)} <span style="color:${v.status === 'adopted' ? 'var(--ok)' : 'var(--bad)'}">${v.status === 'adopted' ? 'รับ' : 'ตีตก'}</span>`).join(' · ')}</td>
      </tr>`;
    }).join('')}</table>`
    : '<div class="empty">ยังไม่มีข้ออ้างที่ผ่านการทดสอบ — นักเรียนต้องพิสูจน์อะไรสักอย่างก่อน</div>');
}

async function loadDiary() {
  const entries = await (await fetch(`/api/diary?student=${encodeURIComponent(current)}`)).json();
  $('view-diary').innerHTML = entries.length ? entries.map(e => `
    <div class="entry">
      <h4>${e.title}</h4><time>${fmt(e.at)}</time>
      <p>${e.body.replace(/</g, '&lt;')}</p>
    </div>`).join('') : '<div class="empty">ยังไม่มีไดอารี่</div>';
}

const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

// What ran, and what is still coming. The ledger answers the first half; the
// plan answers the second, so a quiet school can be told apart from a dead one.
async function loadSchedule() {
  const esc = s => String(s ?? '').replace(/</g, '&lt;');
  const d = await (await fetch('/api/schedule')).json();
  const STATUS = {
    done:     ['รันแล้ว',   'var(--ok)'],
    skipped:  ['ข้าม',      'var(--bad)'],
    upcoming: ['รอถึงคาบ',  'var(--dim)'],
    late:     ['เลยเวลา',   'var(--warn)'],
  };

  const head = `<div class="stats" style="gap:18px;margin-bottom:16px;font-size:13px">
    <span>วันนี้ ${d.day}</span>
    <span>ตอนนี้ ${hhmm(d.nowMinute)}</span>
    <span>ตื่น ${hhmm(d.schedule.wakingWindow[0])}-${hhmm(d.schedule.wakingWindow[1])}</span>
    <span>รอบสั้น ${d.schedule.shortCyclesPerDay}/คน/วัน</span>
    <span style="margin-left:auto">ทบทวน ${hhmm(d.schedule.dailyReviewMinute)}</span></div>`;

  const rows = d.slots.map(slot => `<tr>
    <td style="white-space:nowrap;font-variant-numeric:tabular-nums">${hhmm(slot.minuteOfDay)}</td>
    <td>${slot.kind === 'short' ? 'รอบสั้น' : 'ทบทวนประจำวัน'}</td>
    <td class="why">${slot.students.map(s => {
      const [label, color] = STATUS[s.status] ?? [s.status, 'var(--dim)'];
      const why = s.reason ? ` — ${esc(s.reason)}` : '';
      return `<div>${esc(s.name)} <span style="color:${color};font-weight:600">${label}</span>` +
        `<span style="color:var(--dim)">${why}</span></div>`;
    }).join('')}</td>
  </tr>`).join('');

  const history = d.history.length ? `<h4 style="margin:22px 0 8px">ย้อนหลัง</h4><table>
    <tr><th>วัน</th><th>รันแล้ว</th><th>ข้าม</th></tr>
    ${d.history.map(h => `<tr><td>${h.day}</td>
      <td style="color:var(--ok)">${h.done}</td>
      <td style="color:${h.skipped ? 'var(--bad)' : 'var(--dim)'}">${h.skipped}</td></tr>`).join('')}
    </table>` : '';

  $('view-schedule').innerHTML = head + `<table>
    <tr><th>เวลา</th><th>รอบ</th><th>นักเรียน</th></tr>${rows}</table>` + history;
}

// The Principal's rounds, read back. Empty means it has not walked yet, which
// is itself worth seeing.
async function loadPrincipal() {
  const esc = s => String(s ?? '').replace(/</g, '&lt;');
  const { rounds } = await (await fetch('/api/principal')).json();
  const BADGE = { ok: ['✅', 'var(--ok)'], warn: ['⚠️', 'var(--warn)'], broken: ['🚨', 'var(--bad)'] };
  const MARK = { ok: ['✓', 'var(--ok)'], warn: ['⚠', 'var(--warn)'], broken: ['✗', 'var(--bad)'] };

  if (!rounds.length) {
    $('view-principal').innerHTML =
      '<div class="empty">ครูใหญ่ยังไม่ได้ออกตรวจเลย — รัน bun run principal -- --watch=15</div>';
    return;
  }

  $('view-principal').innerHTML = rounds.map(r => {
    const [badge, color] = BADGE[r.overall] ?? ['•', 'var(--dim)'];
    return `<div class="entry">
      <h4 style="color:${color}">${badge} ${r.overall}</h4><time>${fmt(r.at)}</time>
      <div class="why" style="margin:6px 0 10px">
        นักเรียน ${r.students} · สูตรที่เปิดใช้ ${r.activeStrategies} ·
        คำร้องค้าง ${r.openRequests} · ตรวจซ้ำ ${r.replayChecked} สูตร
        ${r.replayMismatches ? `<span style="color:var(--bad)">· ผลไม่ตรง ${r.replayMismatches}</span>` : ''}
        · merge อัตโนมัติ ${r.autoMergeGreen ? 'เปิด' : 'ปิด'}
      </div>
      ${r.checks.map(c => {
        const [mark, mc] = MARK[c.severity] ?? ['•', 'var(--dim)'];
        return `<div style="margin:3px 0"><span style="color:${mc}">${mark}</span>
          ${esc(c.name)}: ${esc(c.detail)}
          ${c.action ? `<div class="why" style="margin-left:16px">→ ${esc(c.action)}</div>` : ''}</div>`;
      }).join('')}
    </div>`;
  }).join('');
}

// --- force-directed layout: repulsion + edge springs + gravity to center ---
function step() {
  const nodes = graph.nodes.filter(n => layout.has(n.id));
  for (let i = 0; i < nodes.length; i++) {
    const a = layout.get(nodes[i].id);
    for (let j = i + 1; j < nodes.length; j++) {
      const b = layout.get(nodes[j].id);
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy || 0.01;
      const f = 2600 / d2;
      const d = Math.sqrt(d2);
      a.vx += (dx / d) * f; a.vy += (dy / d) * f;
      b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
    }
    a.vx -= a.x * 0.012; a.vy -= a.y * 0.012;
  }
  for (const e of graph.edges) {
    const a = layout.get(e.fromNodeId), b = layout.get(e.toNodeId);
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const f = (d - 95) * 0.02;
    a.vx += (dx / d) * f; a.vy += (dy / d) * f;
    b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
  }
  for (const n of nodes) {
    const p = layout.get(n.id);
    p.vx *= 0.82; p.vy *= 0.82;
    p.x += p.vx; p.y += p.vy;
  }
}

const canvas = $('canvas'), ctx = canvas.getContext('2d');
const view = { scale: 1, x: 0, y: 0 };

// Keep the whole brain in frame however big it grows: fit the node bounding
// box to the canvas, easing toward the target so growth doesn't jolt.
function fit(w, h) {
  const pts = graph.nodes.map(n => layout.get(n.id)).filter(Boolean);
  if (!pts.length) return;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 130;
  const scale = Math.min(
    Math.min(w / (maxX - minX + pad), h / (maxY - minY + pad)), 1.5);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  view.scale += (scale - view.scale) * 0.08;
  view.x += (-cx * view.scale - view.x) * 0.08;
  view.y += (-cy * view.scale - view.y) * 0.08;
}

function draw() {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  fit(w, h);
  ctx.save();
  ctx.translate(w / 2 + view.x, h / 2 + view.y);
  ctx.scale(view.scale, view.scale);

  ctx.strokeStyle = '#2c3541'; ctx.lineWidth = 1;
  for (const e of graph.edges) {
    const a = layout.get(e.fromNodeId), b = layout.get(e.toNodeId);
    if (!a || !b) continue;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  for (const n of graph.nodes) {
    const p = layout.get(n.id); if (!p) continue;
    const kind = KIND[n.kind] || { color: '#8b949e' };
    const r = 5 + n.confidence * 9;
    const dead = n.status === 'debunked';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = dead ? '#30363d' : kind.color;
    ctx.globalAlpha = dead ? 0.5 : 1; ctx.fill();
    if (dead) { ctx.strokeStyle = '#f85149'; ctx.lineWidth = 1.5; ctx.stroke(); }
    if (n.id === selected?.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    if (r > 8 || n.id === selected?.id) {
      ctx.fillStyle = '#c9d1d9'; ctx.font = '11px ui-sans-serif, "Noto Sans Thai", sans-serif';
      ctx.fillText(n.title.slice(0, 26), p.x + r + 4, p.y + 4);
    }
  }
  ctx.restore();
}

function frame() { step(); draw(); requestAnimationFrame(frame); }
frame();

canvas.onclick = (ev) => {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left - rect.width / 2 - view.x) / view.scale;
  const y = (ev.clientY - rect.top - rect.height / 2 - view.y) / view.scale;
  selected = graph.nodes.find(n => {
    const p = layout.get(n.id); if (!p) return false;
    return Math.hypot(p.x - x, p.y - y) < 5 + n.confidence * 9 + 4;
  }) || null;
  const d = $('detail');
  if (!selected) { d.classList.remove('on'); return; }
  const kind = KIND[selected.kind] || { label: selected.kind, color: '#8b949e' };
  d.innerHTML = `<h3 style="color:${kind.color}">${selected.title}</h3>
    <div class="meta">${kind.label} · มั่นใจ ${selected.confidence}${selected.status ? ' · ' + selected.status : ''} · ${fmt(selected.createdAt)}</div>
    <p>${selected.body.replace(/</g, '&lt;')}</p>`;
  d.classList.add('on');
};

$('slider').oninput = async (ev) => {
  const { first, last } = graph.bounds;
  const pct = Number(ev.target.value);
  atTime = pct >= 100 ? Infinity : first + (last - first) * (pct / 100);
  await loadBrain();
};

$('play').onclick = async () => {
  if (playing) { playing = false; $('play').textContent = '▶ เล่นย้อนหนัง'; return; }
  playing = true; $('play').textContent = '⏸ หยุด';
  for (let pct = 0; pct <= 100 && playing; pct += 2) {
    $('slider').value = pct;
    const { first, last } = graph.bounds;
    atTime = pct >= 100 ? Infinity : first + (last - first) * (pct / 100);
    await loadBrain();
    await new Promise(r => setTimeout(r, 110));
  }
  playing = false; $('play').textContent = '▶ เล่นย้อนหนัง';
};

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('on', v.id === 'view-' + b.dataset.view));
  // School-wide views do not follow the selected student, so nothing else
  // fetches them — pull on open rather than making the maker wait for the tick.
  if (b.dataset.view === 'schedule') loadSchedule();
  if (b.dataset.view === 'principal') loadPrincipal();
});

// Live: while parked at "now", keep pulling so growth shows up as it happens.
setInterval(async () => {
  if (playing) return;
  await loadClassroom();
  if (atTime === Infinity) { await loadBrain(); await loadDiary(); await loadTrades(); await loadLibrary(); }
  // Independent of the timeline: the bell and the Principal keep their own time.
  if (document.querySelector('#view-schedule.on')) await loadSchedule();
  if (document.querySelector('#view-principal.on')) await loadPrincipal();
}, 3000);

loadClassroom();
</script>
</body>
</html>
